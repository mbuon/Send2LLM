<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb366"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Rounded square base with warm orange gradient -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>

  <!-- Top-light highlight for depth -->
  <rect x="4" y="4" width="120" height="60" rx="28" ry="28" fill="#ffffff" opacity="0.12"/>

  <!-- Subtle inner border -->
  <rect x="5" y="5" width="118" height="118" rx="27" ry="27" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Chat bubble body (speech context) -->
  <g filter="url(#shadow)">
    <path d="M 30 32
             Q 30 24 38 24
             L 90 24
             Q 98 24 98 32
             L 98 68
             Q 98 76 90 76
             L 62 76
             L 50 90
             L 52 76
             L 38 76
             Q 30 76 30 68
             Z"
          fill="url(#bubble)"/>
  </g>

  <!-- Three context dots inside the bubble (AI thought) -->
  <circle cx="50" cy="50" r="4" fill="#f97316"/>
  <circle cx="64" cy="50" r="4" fill="#1d1d1f"/>
  <circle cx="78" cy="50" r="4" fill="#f97316"/>

  <!-- Send arrow — diagonal, emerging from the bubble toward the LLM -->
  <g transform="translate(70 70) rotate(-45)" filter="url(#shadow)">
    <!-- Arrow shaft -->
    <rect x="0" y="-4" width="32" height="8" rx="4" ry="4" fill="url(#arrow)"/>
    <!-- Arrow head -->
    <path d="M 32 -12 L 48 0 L 32 12 Z" fill="url(#arrow)"/>
  </g>

  <!-- Tiny sparkle accent near arrow tip -->
  <g transform="translate(108 34)">
    <path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z"
          fill="#ffffff" opacity="0.95"/>
  </g>
  <g transform="translate(100 48)">
    <path d="M 0 -3 L 0.7 -0.7 L 3 0 L 0.7 0.7 L 0 3 L -0.7 0.7 L -3 0 L -0.7 -0.7 Z"
          fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
